<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$ · Akash V. Maharaj</title>
<meta name="description" content="$title$">
<link rel="stylesheet" href="/style.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
$if(math)$
$math$
$endif$
</head>
<body>
<button id="theme-toggle" type="button"></button>
<a class="back" href="/">← Akash V. Maharaj</a>
<article>
<h1>$title$</h1>
<p class="muted small">$date$</p>
$body$
</article>
<footer><a href="/">Home</a> · <a href="/#writing">All posts</a></footer>
<script>
(function () {
  var b = document.getElementById("theme-toggle"), r = document.documentElement,
      m = matchMedia("(prefers-color-scheme: dark)");
  function cur() { return r.dataset.theme || (m.matches ? "dark" : "light"); }
  function label() {
    var d = cur() === "dark";
    b.textContent = d ? "\u2600" : "\u263E";
    b.title = "Switch to " + (d ? "light" : "dark") + " mode";
    b.setAttribute("aria-label", b.title);
  }
  b.onclick = function () {
    var t = cur() === "dark" ? "light" : "dark";
    r.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (e) {}
    label();
  };
  m.addEventListener("change", label);
  label();
})();
</script>
</body>
</html>
